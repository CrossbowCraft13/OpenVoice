name: Feature Request
description: Suggest an idea for OpenVoice
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe what you'd like to see added.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should the feature do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives have you considered?

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This feature can work fully offline
          required: true
        - label: This feature does not require telemetry or analytics
          required: true
