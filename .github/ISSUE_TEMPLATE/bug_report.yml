name: Bug Report
description: Report a bug to help us improve OpenVoice
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Say "Hey OpenVoice...'
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Device model and Android version
      placeholder: "Pixel 8, Android 14"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenVoice Version
      placeholder: "1.0.0-beta"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Privacy
      description: By submitting this issue, you confirm that no personal data is included in the logs
      options:
        - label: I confirm no personal data is included
          required: true
