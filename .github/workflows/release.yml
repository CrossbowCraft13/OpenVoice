name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Serialize releases so overlapping merges to main never race on the VERSION bump.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Resolve the version for this run:
      #   - tag push   -> the tag itself (manual release)
      #   - main push  -> bump VERSION (patch +1), release that version
      #   - dispatch   -> current VERSION, no bump
      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/* ]]; then
            VERSION="${REF_NAME#v}"
            echo "trigger=tag" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            V=$(cat VERSION)
            BASE="${V%-*}"
            SUFFIX="${V#*-}"
            if [ "$SUFFIX" = "$V" ]; then SUFFIX=""; else SUFFIX="-${SUFFIX}"; fi
            MAJOR="${BASE%%.*}"
            REST="${BASE#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            [ "$PATCH" = "$REST" ] && PATCH=0
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}${SUFFIX}"
            echo "$VERSION" > VERSION
            echo "trigger=main" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(cat VERSION)
            echo "trigger=dispatch" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The release build signs through Gradle: keystore.properties (gitignored)
      # is created from repository secrets so both the APK and AAB come out
      # signed in one invocation.
      - name: Configure release signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ] || [ -z "${KEY_ALIAS:-}" ] || \
             [ -z "${KEY_STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets are missing (SIGNING_KEY, KEY_ALIAS, KEY_STORE_PASSWORD, KEY_PASSWORD). Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "${SIGNING_KEY}" | base64 --decode > "$KEYSTORE"
          {
            echo "storeFile=$KEYSTORE"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$KEY_STORE_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          cp app/build/outputs/apk/release/*.apk "openvoice-${TAG}.apk"
          cp app/build/outputs/bundle/release/*.aab "openvoice-${TAG}.aab"
          sha256sum "openvoice-${TAG}.apk" "openvoice-${TAG}.aab" > SHA256SUMS.txt

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            echo "## Changes since ${PREV_TAG}" > changes.md
          else
            RANGE="HEAD~30..HEAD"
            echo "## Changes" > changes.md
          fi
          git log --oneline --no-merges "$RANGE" | sed 's/^/- /' >> changes.md
          {
            echo "# OpenVoice ${TAG}"
            echo ""
            echo "## Install"
            echo "- [Download APK](openvoice-${TAG}.apk)"
            echo "- [Download AAB](openvoice-${TAG}.aab)"
            echo ""
            echo "## Checksums (SHA-256)"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo ""
            cat changes.md
            echo ""
            echo "See [CHANGELOG.md](CHANGELOG.md) for full details."
          } > release-body.md

      # Only auto-releases bump and commit VERSION. The tag push uses the
      # GITHUB_TOKEN, so it will not re-trigger this workflow (no loop).
      - name: Commit version bump and tag
        if: steps.version.outputs.trigger == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin main
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: release-body.md
          files: |
            openvoice-${{ steps.version.outputs.tag }}.apk
            openvoice-${{ steps.version.outputs.tag }}.aab
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
