name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: openvoice-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html

  coverage:
    name: Emulator Tests & Coverage Gates
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Keep the branch floor deliberately below the current result while the
    # project closes the remaining platform-bound branches. Raise this in
    # small increments instead of allowing regressions back to zero coverage.
    env:
      MIN_LINE_COVERAGE: "0.80"
      MIN_BRANCH_COVERAGE: "0.65"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run unit, instrumented, and merged coverage tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-animations: true
          script: ./gradlew jacocoFullReport --stacktrace

      - name: Report and enforce merged coverage thresholds
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("app/build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml")
          if not report.is_file():
              raise SystemExit(f"JaCoCo XML report not found: {report}")

          root = ET.parse(report).getroot()
          counters = {
              counter.attrib["type"]: counter
              for counter in root.findall("counter")
          }
          required = ("LINE", "BRANCH")
          missing = [kind for kind in required if kind not in counters]
          if missing:
              raise SystemExit(f"JaCoCo XML report is missing counters: {missing}")

          results = {}
          for kind in required:
              counter = counters[kind]
              covered = int(counter.attrib["covered"])
              missed = int(counter.attrib["missed"])
              total = covered + missed
              ratio = covered / total if total else 0.0
              results[kind] = (covered, total, ratio)
              print(f"Merged {kind.lower()} coverage: {covered}/{total} = {ratio:.2%}")

          thresholds = {
              "LINE": float(os.environ["MIN_LINE_COVERAGE"]),
              "BRANCH": float(os.environ["MIN_BRANCH_COVERAGE"]),
          }
          failures = [
              f"{kind.lower()} coverage {results[kind][2]:.2%} < {thresholds[kind]:.2%}"
              for kind in required
              if results[kind][2] < thresholds[kind]
          ]

          summary = ["## JaCoCo coverage", "", "| Counter | Covered | Total | Result |", "|---|---:|---:|---:|"]
          summary.extend(
              f"| {kind.title()} | {covered} | {total} | {ratio:.2%} (minimum {thresholds[kind]:.2%}) |"
              for kind, (covered, total, ratio) in results.items()
          )
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(summary) + "\n")

          if failures:
              raise SystemExit("Coverage gate failed: " + "; ".join(failures))
          PY

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-full-report
          path: |
            app/build/reports/jacoco/jacocoFullReport
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/**
          if-no-files-found: warn

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # C++/NDK builds are not reliably traced by CodeQL's extractor, so
          # analysis covers Java/Kotlin only. The native code is the llama.cpp
          # JNI bridge (vendored via submodule, see app/CMakeLists.txt) plus a
          # small whisper stub.
          languages: java-kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        run: ./gradlew assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/dependency-review-action@v4

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ShiftLeftSecurity/scan-action@master
